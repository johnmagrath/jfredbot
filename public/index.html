<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Premier League scores — live results, kickoff times, and venues.">
  <meta name="theme-color" content="#0a0e27">
  <title>Premier League Scores</title>
  <style>
    :root {
      --bg-color: #0a0e27;
      --text-color: #f5f5f5;
      --hint-color: #9ca3af;
      --secondary-bg-color: #141a3a;
      --button-color: #00ff85;
      --button-text-color: #0a0e27;
      --accent: #38003c;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f4f5f7;
        --text-color: #111827;
        --hint-color: #6b7280;
        --secondary-bg-color: #ffffff;
        --button-color: #38003c;
        --button-text-color: #fff;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 12px 16px 100px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 20px;
    }
    .logo-icon { font-size: 24px; }
    .header-right {
      font-size: 12px;
      color: var(--hint-color);
    }
    .hero {
      background: linear-gradient(135deg, #38003c 0%, #54004d 50%, #00ff85 160%);
      border-radius: 20px;
      padding: 22px 20px;
      color: #fff;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '⚽';
      position: absolute;
      right: 16px;
      bottom: 10px;
      font-size: 52px;
      opacity: 0.18;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .hero p {
      margin: 0;
      opacity: 0.92;
      font-size: 14px;
    }
    .hero .date-line {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.95;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .toolbar .count {
      font-size: 13px;
      color: var(--hint-color);
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--button-color);
      color: var(--button-text-color);
    }
    .btn:active { opacity: 0.88; transform: scale(0.98); }
    .btn.secondary {
      background: var(--secondary-bg-color);
      color: var(--text-color);
      border: 1px solid rgba(128, 128, 128, 0.25);
    }
    .state-card {
      background: var(--secondary-bg-color);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      border: 1px solid rgba(128, 128, 128, 0.15);
    }
    .state-card .icon { font-size: 36px; margin-bottom: 10px; }
    .state-card h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }
    .state-card p {
      margin: 0;
      font-size: 14px;
      color: var(--hint-color);
    }
    .matches { display: grid; gap: 12px; }
    .match-card {
      background: var(--secondary-bg-color);
      border-radius: 16px;
      padding: 14px 14px 12px;
      border: 1px solid rgba(128, 128, 128, 0.15);
    }
    .match-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--hint-color);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .status-badge.pre {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
    }
    .status-badge.in {
      background: rgba(0, 255, 133, 0.18);
      color: #00ff85;
    }
    .status-badge.post {
      background: rgba(156, 163, 175, 0.18);
      color: #d1d5db;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-badge.in .status-dot {
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .team-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
    }
    @media (prefers-color-scheme: light) {
      .team-logo {
        background: rgba(0, 0, 0, 0.04);
      }
    }
    .team-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--hint-color);
    }
    .team-logo-fallback[hidden] {
      display: none !important;
    }
    .team-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      word-break: break-word;
    }
    .scorebox {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 64px;
    }
    .score {
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    .score.scheduled {
      font-size: 15px;
      font-weight: 700;
      color: var(--hint-color);
    }
    .venue {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.15);
      font-size: 12px;
      color: var(--hint-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .footer {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    .footer .btn { flex: 1; }
    .footnote {
      text-align: center;
      font-size: 11px;
      color: var(--hint-color);
      margin-top: 14px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(128, 128, 128, 0.25);
      border-top-color: #00ff85;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--secondary-bg-color);
      color: var(--text-color);
      border: 1px solid rgba(128, 128, 128, 0.25);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">⚽</span>
        <span>Premier League</span>
      </div>
      <div class="header-right" id="updated-at">Loading…</div>
    </header>

    <div class="hero">
      <h1>Premier League</h1>
      <p>Today's scores, live results & kickoff times.</p>
      <div class="date-line" id="today-label"></div>
    </div>

    <div class="toolbar">
      <span class="count" id="match-count"></span>
      <button class="btn secondary" id="refresh-btn" type="button">↻ Refresh</button>
    </div>

    <div id="content">
      <div class="state-card" id="loading-state">
        <div class="spinner"></div>
        <h2>Loading matches</h2>
        <p>Fetching today's Premier League schedule…</p>
      </div>
    </div>

    <div class="footer">
      <button class="btn secondary" id="share-btn" type="button">Share</button>
    </div>

    <div class="footnote">Data from ESPN • Times shown in your local timezone</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard';

    const contentEl = document.getElementById('content');
    const todayLabelEl = document.getElementById('today-label');
    const matchCountEl = document.getElementById('match-count');
    const updatedAtEl = document.getElementById('updated-at');
    const refreshBtn = document.getElementById('refresh-btn');
    const shareBtn = document.getElementById('share-btn');
    const toastEl = document.getElementById('toast');

    let refreshTimer = null;
    let toastTimer = null;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    function formatTodayLabel() {
      const now = new Date();
      return now.toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric',
      });
    }

    function formatKickoff(iso) {
      return new Date(iso).toLocaleTimeString(undefined, {
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function formatUpdated() {
      return new Date().toLocaleTimeString(undefined, {
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function statusClass(state) {
      if (state === 'in') return 'in';
      if (state === 'post') return 'post';
      return 'pre';
    }

    function teamLogoUrl(team) {
      if (!team) return '';
      if (typeof team.logo === 'string' && team.logo) return team.logo;
      if (Array.isArray(team.logos) && team.logos.length) {
        const preferred = team.logos.find((l) => l && l.href) || team.logos[0];
        if (preferred && preferred.href) return preferred.href;
      }
      if (team.flag && team.flag.href) return team.flag.href;
      return '';
    }

    function parseMatch(event) {
      const comp = (event.competitions && event.competitions[0]) || {};
      const status = (event.status && event.status.type) || {};
      const venue = comp.venue || {};
      const city = venue.address && venue.address.city ? venue.address.city : '';
      const competitors = comp.competitors || [];

      const home = competitors.find((c) => c.homeAway === 'home') || competitors[0] || {};
      const away = competitors.find((c) => c.homeAway === 'away') || competitors[1] || {};

      function teamData(c) {
        const team = c.team || {};
        return {
          name: team.shortDisplayName || team.displayName || team.name || 'TBD',
          fullName: team.displayName || team.name || 'TBD',
          abbr: team.abbreviation || '',
          logo: teamLogoUrl(team),
          score: c.score != null ? String(c.score) : '0',
        };
      }

      return {
        id: event.id,
        name: event.name || '',
        date: event.date,
        kickoff: formatKickoff(event.date),
        statusText: status.description || status.detail || 'Scheduled',
        statusState: status.state || 'pre',
        venue: [venue.fullName, city].filter(Boolean).join(' · '),
        home: teamData(home),
        away: teamData(away),
      };
    }

    function renderTeamLogo(team) {
      const name = escapeHtml(team.fullName || team.name);
      const abbr = escapeHtml(team.abbr || team.name.slice(0, 3).toUpperCase());
      if (team.logo) {
        return `
          <img class="team-logo" src="${escapeHtml(team.logo)}" alt="${name} crest" width="48" height="48" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
          <div class="team-logo team-logo-fallback" hidden aria-hidden="true">${abbr}</div>`;
      }
      return `<div class="team-logo team-logo-fallback" aria-hidden="true">${abbr}</div>`;
    }

    function renderMatches(matches) {
      if (!matches.length) {
        contentEl.innerHTML = `
          <div class="state-card">
            <div class="icon">😴</div>
            <h2>No matches today</h2>
            <p>There are no Premier League fixtures scheduled for today. Check back tomorrow!</p>
          </div>`;
        matchCountEl.textContent = '0 matches';
        return;
      }

      matchCountEl.textContent = `${matches.length} match${matches.length === 1 ? '' : 'es'} today`;

      const html = matches.map((m) => {
        const live = m.statusState === 'in';
        const finished = m.statusState === 'post';
        const scoreText = (live || finished)
          ? `${m.home.score} – ${m.away.score}`
          : m.kickoff;
        const scoreClass = (live || finished) ? '' : 'scheduled';

        return `
          <article class="match-card" data-match-id="${escapeHtml(m.id)}">
            <div class="match-meta">
              <span>${escapeHtml(m.kickoff)}</span>
              <span class="status-badge ${statusClass(m.statusState)}">
                <span class="status-dot"></span>
                ${escapeHtml(m.statusText)}
              </span>
            </div>
            <div class="teams">
              <div class="team home">
                ${renderTeamLogo(m.home)}
                <div class="team-name">${escapeHtml(m.home.name)}</div>
              </div>
              <div class="scorebox">
                <div class="score ${scoreClass}">${escapeHtml(scoreText)}</div>
              </div>
              <div class="team away">
                ${renderTeamLogo(m.away)}
                <div class="team-name">${escapeHtml(m.away.name)}</div>
              </div>
            </div>
            ${m.venue ? `<div class="venue">📍 ${escapeHtml(m.venue)}</div>` : ''}
          </article>`;
      }).join('');

      contentEl.innerHTML = `<div class="matches">${html}</div>`;
    }

    function renderError(message) {
      contentEl.innerHTML = `
        <div class="state-card">
          <div class="icon">⚠️</div>
          <h2>Couldn't load matches</h2>
          <p>${escapeHtml(message)}</p>
        </div>`;
      matchCountEl.textContent = '';
    }

    async function loadMatches({ manual = false } = {}) {
      refreshBtn.disabled = true;

      if (!contentEl.querySelector('.match-card')) {
        contentEl.innerHTML = `
          <div class="state-card" id="loading-state">
            <div class="spinner"></div>
            <h2>Loading matches</h2>
            <p>Fetching today's Premier League schedule…</p>
          </div>`;
      }

      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error(`API returned ${resp.status}`);

        const data = await resp.json();
        const matches = (data.events || []).map(parseMatch).sort(
          (a, b) => new Date(a.date) - new Date(b.date)
        );

        renderMatches(matches);
        updatedAtEl.textContent = `Updated ${formatUpdated()}`;
        if (manual) showToast('Scores updated');
      } catch (err) {
        console.error(err);
        renderError('Please check your connection and try again.');
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function shareApp() {
      const shareData = {
        title: 'Premier League Scores',
        text: "Check today's Premier League scores — live results and kickoff times.",
        url: window.location.href,
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const text = `${shareData.text}\n${shareData.url}`;
      if (navigator.clipboard) {
        try {
          await navigator.clipboard.writeText(text);
          showToast('Link copied to clipboard');
          return;
        } catch (err) {
          console.warn('Clipboard write failed', err);
        }
      }

      showToast('Share this page using your browser menu');
    }

    function setupControls() {
      refreshBtn.addEventListener('click', () => loadMatches({ manual: true }));
      shareBtn.addEventListener('click', shareApp);
    }

    function init() {
      todayLabelEl.textContent = formatTodayLabel();
      setupControls();
      loadMatches();

      refreshTimer = setInterval(() => loadMatches(), 60000);
      window.addEventListener('beforeunload', () => clearInterval(refreshTimer));
    }

    init();
  </script>
</body>
</html>
