<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="jfredbot hero image">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2b8ed6"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <g transform="translate(40,60)">
    <text x="0" y="64" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#fff">jfredbot</text>
    <text x="0" y="110" font-family="Inter, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.95)">Telegram mini‑app</text>

    <rect x="-6" y="126" width="420" height="6" rx="3" fill="rgba(255,255,255,0.08)" />

    <text x="0" y="158" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">Lightweight demo page for Telegram Web Apps — click to open from Telegram.</text>
  </g>

  <!-- Simple paper-plane icon on the right -->
  <g transform="translate(430,60) scale(2.1)" fill="#ffffff" filter="url(#soft)">
    <path d="M2 11.5 L22 2 L11 21 L9 14 L2 11.5 Z" fill="rgba(255,255,255,0.95)"/>
    <path d="M2 11.5 L11 21 L9 14 L2 11.5 Z" fill="rgba(0,0,0,0.06)"/>
    <path d="M2 11.5 L22 2 L11 10 L2 11.5 Z" fill="rgba(255,255,255,0.8)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="540" cy="260" r="28" fill="rgba(255,255,255,0.06)" />
  <circle cx="600" cy="220" r="16" fill="rgba(255,255,255,0.04)" />

</svg>
