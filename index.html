<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>World Cup Today — jfredbot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--tg-theme-bg-color, #0b1f14);
      color: var(--tg-theme-text-color, #f5f5f5);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 12px 16px 100px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 20px;
    }
    .logo-icon { font-size: 24px; }
    .header-right {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #9ca3af);
    }
    .hero {
      background: linear-gradient(135deg, #0d5c2e 0%, #1a7a3e 45%, #c9a227 100%);
      border-radius: 20px;
      padding: 22px 20px;
      color: #fff;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '⚽';
      position: absolute;
      right: 16px;
      bottom: 10px;
      font-size: 52px;
      opacity: 0.18;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .hero p {
      margin: 0;
      opacity: 0.92;
      font-size: 14px;
    }
    .hero .date-line {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.95;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .toolbar .count {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #9ca3af);
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    .btn:active { opacity: 0.88; transform: scale(0.98); }
    .btn.secondary {
      background: var(--tg-theme-secondary-bg-color, #1f2937);
      color: var(--tg-theme-text-color, #f5f5f5);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .state-card {
      background: var(--tg-theme-secondary-bg-color, #142218);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .state-card .icon { font-size: 36px; margin-bottom: 10px; }
    .state-card h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }
    .state-card p {
      margin: 0;
      font-size: 14px;
      color: var(--tg-theme-hint-color, #9ca3af);
    }
    .matches { display: grid; gap: 12px; }
    .match-card {
      background: var(--tg-theme-secondary-bg-color, #142218);
      border-radius: 16px;
      padding: 14px 14px 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .match-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--tg-theme-hint-color, #9ca3af);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .status-badge.pre {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
    }
    .status-badge.in {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
    }
    .status-badge.post {
      background: rgba(156, 163, 175, 0.18);
      color: #d1d5db;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-badge.in .status-dot {
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .team.away { text-align: right; }
    .team.home { text-align: left; }
    .flag {
      width: 40px;
      height: 28px;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.08);
    }
    .team-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      word-break: break-word;
    }
    .scorebox {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 64px;
    }
    .score {
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    .score.scheduled {
      font-size: 15px;
      font-weight: 700;
      color: var(--tg-theme-hint-color, #9ca3af);
    }
    .venue {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      color: var(--tg-theme-hint-color, #9ca3af);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .footer {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    .footer .btn { flex: 1; }
    .footnote {
      text-align: center;
      font-size: 11px;
      color: var(--tg-theme-hint-color, #6b7280);
      margin-top: 14px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #c9a227;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">🏆</span>
        <span>jfredbot</span>
      </div>
      <div class="header-right" id="updated-at">Loading…</div>
    </header>

    <div class="hero">
      <h1>FIFA World Cup 2026</h1>
      <p>Today's matches, live scores & kickoff times.</p>
      <div class="date-line" id="today-label"></div>
    </div>

    <div class="toolbar">
      <span class="count" id="match-count"></span>
      <button class="btn secondary" id="refresh-btn" type="button">↻ Refresh</button>
    </div>

    <div id="content">
      <div class="state-card" id="loading-state">
        <div class="spinner"></div>
        <h2>Loading matches</h2>
        <p>Fetching today's World Cup schedule…</p>
      </div>
    </div>

    <div class="footer">
      <button class="btn secondary" id="share-btn" type="button">Share</button>
      <button class="btn secondary" id="close-btn" type="button">Close</button>
    </div>

    <div class="footnote">Data from ESPN • Times shown in your local timezone</div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';

    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
    }

    const contentEl = document.getElementById('content');
    const todayLabelEl = document.getElementById('today-label');
    const matchCountEl = document.getElementById('match-count');
    const updatedAtEl = document.getElementById('updated-at');
    const refreshBtn = document.getElementById('refresh-btn');
    const shareBtn = document.getElementById('share-btn');
    const closeBtn = document.getElementById('close-btn');

    let refreshTimer = null;

    function haptic(type) {
      if (!tg || !tg.HapticFeedback) return;
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    }

    function formatTodayLabel() {
      const now = new Date();
      return now.toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric',
      });
    }

    function formatKickoff(iso) {
      return new Date(iso).toLocaleTimeString(undefined, {
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function formatUpdated() {
      return new Date().toLocaleTimeString(undefined, {
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function statusClass(state) {
      if (state === 'in') return 'in';
      if (state === 'post') return 'post';
      return 'pre';
    }

    function parseMatch(event) {
      const comp = (event.competitions && event.competitions[0]) || {};
      const status = (event.status && event.status.type) || {};
      const venue = comp.venue || {};
      const city = venue.address && venue.address.city ? venue.address.city : '';
      const competitors = comp.competitors || [];

      const home = competitors.find((c) => c.homeAway === 'home') || competitors[0] || {};
      const away = competitors.find((c) => c.homeAway === 'away') || competitors[1] || {};

      function teamData(c) {
        const team = c.team || {};
        return {
          name: team.displayName || team.name || 'TBD',
          abbr: team.abbreviation || '',
          flag: team.flag && team.flag.href ? team.flag.href : '',
          score: c.score != null ? String(c.score) : '0',
        };
      }

      return {
        id: event.id,
        name: event.name || '',
        date: event.date,
        kickoff: formatKickoff(event.date),
        statusText: status.description || status.detail || 'Scheduled',
        statusState: status.state || 'pre',
        venue: [venue.fullName, city].filter(Boolean).join(' · '),
        home: teamData(home),
        away: teamData(away),
      };
    }

    function renderMatches(matches) {
      if (!matches.length) {
        contentEl.innerHTML = `
          <div class="state-card">
            <div class="icon">😴</div>
            <h2>No matches today</h2>
            <p>There are no World Cup fixtures scheduled for today. Check back tomorrow!</p>
          </div>`;
        matchCountEl.textContent = '0 matches';
        return;
      }

      matchCountEl.textContent = `${matches.length} match${matches.length === 1 ? '' : 'es'} today`;

      const html = matches.map((m) => {
        const live = m.statusState === 'in';
        const finished = m.statusState === 'post';
        const scoreText = (live || finished)
          ? `${m.away.score} – ${m.home.score}`
          : m.kickoff;
        const scoreClass = (live || finished) ? '' : 'scheduled';

        return `
          <article class="match-card" data-match-id="${m.id}">
            <div class="match-meta">
              <span>${m.kickoff}</span>
              <span class="status-badge ${statusClass(m.statusState)}">
                <span class="status-dot"></span>
                ${m.statusText}
              </span>
            </div>
            <div class="teams">
              <div class="team away">
                ${m.away.flag ? `<img class="flag" src="${m.away.flag}" alt="${m.away.abbr} flag" loading="lazy">` : '<div class="flag"></div>'}
                <div class="team-name">${m.away.name}</div>
              </div>
              <div class="scorebox">
                <div class="score ${scoreClass}">${scoreText}</div>
              </div>
              <div class="team home">
                ${m.home.flag ? `<img class="flag" src="${m.home.flag}" alt="${m.home.abbr} flag" loading="lazy">` : '<div class="flag"></div>'}
                <div class="team-name">${m.home.name}</div>
              </div>
            </div>
            ${m.venue ? `<div class="venue">📍 ${m.venue}</div>` : ''}
          </article>`;
      }).join('');

      contentEl.innerHTML = `<div class="matches">${html}</div>`;
    }

    function renderError(message) {
      contentEl.innerHTML = `
        <div class="state-card">
          <div class="icon">⚠️</div>
          <h2>Couldn't load matches</h2>
          <p>${message}</p>
        </div>`;
      matchCountEl.textContent = '';
      haptic('error');
    }

    async function loadMatches({ manual = false } = {}) {
      if (manual) haptic('light');
      refreshBtn.disabled = true;

      if (!contentEl.querySelector('.match-card')) {
        contentEl.innerHTML = `
          <div class="state-card" id="loading-state">
            <div class="spinner"></div>
            <h2>Loading matches</h2>
            <p>Fetching today's World Cup schedule…</p>
          </div>`;
      }

      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error(`API returned ${resp.status}`);

        const data = await resp.json();
        const matches = (data.events || []).map(parseMatch).sort(
          (a, b) => new Date(a.date) - new Date(b.date)
        );

        renderMatches(matches);
        updatedAtEl.textContent = `Updated ${formatUpdated()}`;
        if (manual) haptic('success');
      } catch (err) {
        console.error(err);
        renderError('Please check your connection and try again.');
      } finally {
        refreshBtn.disabled = false;
      }
    }

    function setupControls() {
      refreshBtn.addEventListener('click', () => loadMatches({ manual: true }));

      closeBtn.addEventListener('click', () => {
        haptic('light');
        if (tg) tg.close();
        else window.close();
      });

      shareBtn.addEventListener('click', () => {
        haptic('light');
        const text = "Check today's FIFA World Cup matches in jfredbot!";
        if (tg && typeof tg.switchInlineQuery === 'function') {
          tg.switchInlineQuery('world cup matches', true);
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => {
            if (tg) tg.showAlert('Share text copied!');
          });
        } else if (tg) {
          tg.showAlert(text);
        }
      });
    }

    function init() {
      todayLabelEl.textContent = formatTodayLabel();
      setupControls();
      loadMatches();

      refreshTimer = setInterval(() => loadMatches(), 60000);
      window.addEventListener('beforeunload', () => clearInterval(refreshTimer));
    }

    init();
  </script>
</body>
</html>
